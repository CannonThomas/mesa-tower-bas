
<script>
(function(){
const $ = id => document.getElementById(id);
const S = makeSim();
for (let i = 0; i < 24*60/DT; i++) step(S);   // open on a plant that has already run a day
S.alarms.length = 0;

const f1 = x => x.toFixed(1), pc = x => Math.round(x*100) + ' %', deg = x => f1(x) + ' °F';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const clock = t => { const m = Math.floor(t); return DAYS[Math.floor(m/1440)%7] + ' ' + String(Math.floor(m/60)%24).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
const cache = {};
function set(id, v){ if (cache[id] !== v){ cache[id] = v; $(id).textContent = v; } }
const NS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs, parent, text){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; }

/* ---------- navigation: tabs pick the view, the tree picks the equipment ---------- */
let tab = 'graphics', node = 'floor', sel = 1, zoneNode = false, speed = 1, hover = null;
const current = () => tab === 'graphics' ? node : tab;
function go(t, n){
  tab = t; if (n) node = n;
  const v = current();
  ['floor','ahu','logic','trends','alarms'].forEach(k => $('v-'+k).hidden = k !== v);
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === tab));
  try { history.replaceState(null, '', '#'+v); } catch(e){}
  render(true);
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });
$('speed').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; speed = +b.dataset.v;
  document.querySelectorAll('#speed button').forEach(x => x.setAttribute('aria-pressed', x === b)); });

const TREE = [['floor','Level 1','l1'], ['ahu','AHU-1','l2']].concat(S.zones.map((z, i) => ['z'+i, 'VAV-'+z.id+' '+z.name, 'l2']));
$('tree').innerHTML = TREE.map(t => '<li><button type="button" class="'+t[2]+'" data-n="'+t[0]+'"><i></i>'+t[1]+'</button></li>').join('');
const treeBtn = {}; document.querySelectorAll('#tree button').forEach(b => treeBtn[b.dataset.n] = b);
$('tree').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const n = b.dataset.n;
  if (n[0] === 'z'){ sel = +n.slice(1); zoneNode = true; go('graphics', 'floor'); }
  else { zoneNode = false; go('graphics', n); }
});
$('go-floor').addEventListener('click', () => { zoneNode = false; go('graphics', 'floor'); });

/* ---------- floor plan ---------- */
const STATE = {'-3':['Cold','--z-3'],'-2':['Cool','--z-2'],'-1':['Slightly cool','--z-1'],'0':['Ideal','--z0'],'1':['Slightly warm','--z1'],'2':['Warm','--z2'],'3':['Hot','--z3']};
function zstate(z){
  const d = zoneDev(z, S.occ), a = Math.abs(d), l = a > 3 ? 3 : a > 1.5 ? 2 : a > .5 ? 1 : 0;
  if (!S.occ && l === 0) return ['Unoccupied', '--zu'];
  return STATE[String(d < 0 ? -l : l)];
}
const zel = S.zones.map((z, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'zone'; b.style.gridArea = 'z'+z.id; b.id = 'zone-'+z.id;
  b.innerHTML = '<span class="zn">'+z.id+' · '+z.name+'</span><span class="zt"></span><span class="zl"></span><span class="zs"></span>';
  b.addEventListener('click', () => { sel = i; zoneNode = true; render(true); });
  $('plan').appendChild(b);
  const th = document.createElement('div'); th.style.gridArea = 't'+z.id; $('thumb').appendChild(th);
  return {b, t:b.children[1], l:b.children[2], s:b.children[3], th};
});
$('zd-up').addEventListener('click', () => { const z = S.zones[sel]; z.sp = clamp(z.sp+.5, 66, 78); render(true); });
$('zd-dn').addEventListener('click', () => { const z = S.zones[sel]; z.sp = clamp(z.sp-.5, 66, 78); render(true); });

function renderFloor(){
  S.zones.forEach((z, i) => {
    const e = zel[i], label = zstate(z)[0];
    e.t.textContent = f1(z.T) + '°';
    e.l.textContent = label;
    e.s.textContent = 'SP ' + f1(z.sp) + ' · flow ' + Math.round(z.flow*100) + '%';
    e.b.setAttribute('aria-pressed', i === sel);
  });
  const z = S.zones[sel], [c, h] = zoneSps(z, S.occ);
  set('zd-id', 'VAV-'+z.id); set('zd-name', z.name); set('zd-t', deg(z.T)); set('zd-state', zstate(z)[0]);
  set('zd-sp', deg(z.sp)); set('zd-sps', f1(c)+' / '+f1(h)+' °F'); set('zd-dmp', pc(z.dmp));
  set('zd-cfm', Math.round(z.flow*z.cfm).toLocaleString()+' cfm'); set('zd-rh', pc(z.rh));
  set('zd-dat', z.flow > .05 ? deg(S.sat + 35*z.rh) : 'no flow');
}

/* ---------- AHU cutaway ---------- */
const DX = 36, DY = -24;                       // oblique depth vector
const plane = (x, yt, yb) => x+','+yt+' '+(x+DX)+','+(yt+DY)+' '+(x+DX)+','+(yb+DY)+' '+x+','+yb;

// filter and coils: a slab across the airstream, seen from its downstream side
function slab(x, t, yt, yb, front, side, hatch){
  const g = svg('g', {}, $('slabs'));
  svg('polygon', {points: x+','+yt+' '+(x+t)+','+yt+' '+(x+t+DX)+','+(yt+DY)+' '+(x+DX)+','+(yt+DY), fill: front, opacity: .8}, g);
  svg('rect', {x, y: yt, width: t, height: yb-yt, fill: front}, g);
  const face = svg('polygon', {points: plane(x+t, yt, yb), fill: side}, g);
  for (let y = yt+8; y < yb; y += 8) svg('line', {x1: x+t, y1: y, x2: x+t+DX, y2: y+DY, stroke: hatch, 'stroke-width': 1}, g);
  const glow = svg('polygon', {points: plane(x+t, yt, yb), fill: '#fff', opacity: 0}, g);
  return {face, glow};
}
const filt = slab(300, 18, 238, 368, '#aeb9a2', 'url(#gFilt)', '#6f7b63');
const hwc  = slab(430, 16, 238, 368, '#6e2a1c', 'url(#gHot)', '#e0a08f');
const chwc = slab(500, 16, 238, 368, '#1d4672', 'url(#gCold)', '#a9cdf0');
hwc.glow.setAttribute('fill', '#ff9a5c'); chwc.glow.setAttribute('fill', '#7cc4ff');

// dampers: blades fatten as they close
function vDamper(x, yt, yb, n){
  const g = svg('g', {}, $('dampers'));
  svg('polygon', {points: plane(x, yt, yb), fill: '#06080a', opacity: .55, stroke: '#9aa7b2', 'stroke-width': 1.5}, g);
  const H = (yb-yt)/n, blades = [];
  for (let i = 0; i < n; i++) blades.push({p: svg('polygon', {fill: 'url(#gBlade)', stroke: '#30383f', 'stroke-width': .5}, g), yc: yt + (i+.5)*H});
  return pos => blades.forEach(b => { const h = 1.5 + (1-pos)*(H/2 - 1.5);
    b.p.setAttribute('points', x+','+(b.yc-h)+' '+(x+DX)+','+(b.yc+DY-h)+' '+(x+DX)+','+(b.yc+DY+h)+' '+x+','+(b.yc+h)); });
}
function hDamper(x0, y, n, pitch){
  const g = svg('g', {}, $('dampers')), blades = [];
  for (let i = 0; i < n; i++) blades.push({p: svg('polygon', {fill: 'url(#gBlade)', stroke: '#30383f', 'stroke-width': .5}, g), xc: x0 + (i+.5)*pitch});
  return pos => blades.forEach(b => { const w = 1.5 + (1-pos)*(pitch/2 - 1.5);
    b.p.setAttribute('points', (b.xc-w)+','+y+' '+(b.xc+w)+','+y+' '+(b.xc+w+DX)+','+(y+DY)+' '+(b.xc-w+DX)+','+(y+DY)); });
}
const setEA = vDamper(150, 106, 228, 5), setOA = vDamper(150, 238, 368, 5), setRA = hDamper(176, 230, 4, 20);

// fan wheels
function wheel(id, cx, cy, r0, r1){ for (let a = 0; a < 360; a += 30) svg('line', {x1: cx, y1: cy-r0, x2: cx+4, y2: cy-r1, transform: 'rotate('+a+' '+cx+' '+cy+')'}, $(id)); }
wheel('sfan', 640, 302, 9, 25); wheel('rfan', 640, 166, 8, 21);

// airflow: dots that drift with the fan and take the color of the air they carry
const FLOWS = [
  ['M40 300H150', () => S.oat, () => S.oa],
  ['M186 300H428', () => S.mat, () => 1],
  ['M556 300H586M700 300H956', () => S.sat, () => 1],
  ['M956 166H700M586 166H260', () => S.rat, () => 1],
  ['M186 166H40', () => S.rat, () => S.oa],
  ['M224 196V282', () => S.rat, () => 1-S.oa],
].map(f => ({p: svg('path', {d: f[0], class: 'flowdot'}, $('flows')), t: f[1], k: f[2]}));
function airColor(t){ const k = clamp((t-52)/36, 0, 1), m = (a, b) => Math.round(a + (b-a)*k); return 'rgb('+m(74,255)+','+m(170,138)+','+m(255,61)+')'; }

// callouts
const run = () => S.speed > .05;
const LABELS = [
  {t:'Exhaust Damper', x:10,  y:6, a:[168,150], rows:[['Position', () => pc(S.oa)]]},
  {t:'Return Damper',  x:140, y:6, a:[236,216], rows:[['Position', () => pc(1-S.oa)]]},
  {t:'Economizer',     x:270, y:6, rows:[['Mode', () => S.econ ? 'Enabled' : 'Disabled'], ['Min OA', () => pc(S.occ ? S.minOA : 0)]]},
  {t:'Return Fan',     x:560, y:6, a:[640,128], rows:[['Status', () => run() ? 'On' : 'Off'], ['Speed', () => pc(S.speed)]]},
  {t:'Return Air',     x:830, y:6, a:[900,140], rows:[['Temp', () => deg(S.rat)]]},
  {t:'Outside Air',    x:10,  y:432, a:[96,330],  rows:[['Temp', () => deg(S.oat)], ['Damper', () => pc(S.oa)]]},
  {t:'Mixed Air',      x:140, y:432, a:[236,350], rows:[['Temp', () => deg(S.mat)]]},
  {t:'Filter',         x:270, y:432, a:[309,374], rows:[['DP', () => S.fdp.toFixed(2)+' in wc'], ['Status', () => S.fdp > .8 ? 'Dirty' : 'Clean']]},
  {t:'Heating Coil',   x:400, y:432, a:[444,416], rows:[['HW valve', () => pc(S.htg)]]},
  {t:'Cooling Coil',   x:530, y:432, a:[514,416], rows:[['CHW valve', () => pc(S.clg)]]},
  {t:'Supply Fan',     x:660, y:432, a:[660,348], rows:[['Status', () => run() ? 'On' : S.fanCmd ? 'FAULT' : 'Off'], ['Speed', () => pc(S.speed)]]},
  {t:'Supply Air',     x:800, y:432, a:[890,330], rows:[['Temp', () => deg(S.sat)], ['Setpoint', () => deg(S.satSp)], ['Static', () => S.dsp.toFixed(2)+' in wc']]},
];
LABELS.forEach(L => {
  const g = $('labels'), W = 120, H = 22 + 14*L.rows.length;
  if (L.a){ const top = L.y < 200; svg('line', {class: 'lead', x1: L.a[0], y1: L.a[1], x2: L.x + W/2, y2: top ? L.y + H : L.y}, g); svg('circle', {cx: L.a[0], cy: L.a[1], r: 3, fill: '#f4d35e', stroke: '#0b0e11'}, g); }
  svg('rect', {class: 'cbox', x: L.x, y: L.y, width: W, height: H, rx: 3}, g);
  svg('text', {class: 'ct', x: L.x+7, y: L.y+14}, g, L.t);
  L.els = L.rows.map((r, i) => { svg('text', {class: 'cn', x: L.x+7, y: L.y+29+14*i}, g, r[0]); return svg('text', {class: 'cv', x: L.x+W-7, y: L.y+29+14*i}, g, ''); });
  L.last = [];
});

function mode(){
  if (!S.fanCmd) return ['Unoccupied, unit off', ''];
  if (S.faults.fan) return [S.proven ? 'Supply fan fault' : 'Shutdown, no fan status', 'alm'];
  if (!S.occ) return ['Night setback', 'on'];
  if (S.htg > .02) return ['Heating', 'on'];
  if (S.econ) return [S.clg > .02 ? 'Economizer + chilled water' : 'Economizer, free cooling', 'on'];
  return [S.clg > .02 ? 'Mechanical cooling' : 'Ventilation', 'on'];
}
const POINTS = [
  ['AHU1.SF-C','Supply fan start/stop','BO', () => S.fanCmd ? 'On' : 'Off'],
  ['AHU1.SF-S','Supply fan status','BI', () => run() ? 'Running' : 'Stopped'],
  ['AHU1.SF-VFD','Supply fan speed','AO', () => pc(S.speed)],
  ['AHU1.RF-VFD','Return fan speed, tracks supply','AO', () => pc(S.speed)],
  ['AHU1.DA-P','Duct static pressure','AI', () => S.dsp.toFixed(2)+' in. w.c.'],
  ['AHU1.SA-T','Supply air temperature','AI', () => deg(S.sat)],
  ['AHU1.MA-T','Mixed air temperature','AI', () => deg(S.mat)],
  ['AHU1.RA-T','Return air temperature','AI', () => deg(S.rat)],
  ['AHU1.OA-T','Outside air temperature','AI', () => deg(S.oat)],
  ['AHU1.OA-D','Outside air damper','AO', () => pc(S.oa)],
  ['AHU1.RA-D','Return air damper','AO', () => pc(1-S.oa)],
  ['AHU1.EA-D','Exhaust air damper','AO', () => pc(S.oa)],
  ['AHU1.CHW-V','Chilled water valve','AO', () => pc(S.clg)],
  ['AHU1.HW-V','Hot water valve','AO', () => pc(S.htg)],
  ['AHU1.FLT-DP','Filter differential pressure','AI', () => S.fdp.toFixed(2)+' in. w.c.'],
  ['AHU1.ECON-EN','Economizer enable','BV', () => S.econ ? 'Enabled' : 'Disabled'],
];
$('pts').innerHTML = POINTS.map((p, i) => '<tr><td class="num" style="text-align:left">'+p[0]+'</td><td>'+p[1]+'</td><td>'+p[2]+'</td><td class="num pv" id="pt'+i+'"></td></tr>').join('');
$('a-mode').innerHTML = '<i></i><span></span>';

function drawMini(id, out, fn, unit, dp){
  const cv = $(id), L = S.log.slice(-145), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w || L.length < 2) return;
  if (cv.width !== Math.round(w*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  let lo = Infinity, hi = -Infinity; for (const r of L){ const v = fn(r); if (v < lo) lo = v; if (v > hi) hi = v; }
  if (hi - lo < 4){ const m = (hi+lo)/2; lo = m-2; hi = m+2; }
  const X = i => 2 + i/(L.length-1)*(w-34), Y = v => h-4 - (v-lo)/(hi-lo)*(h-10);
  g.strokeStyle = '#1e262d'; g.lineWidth = 1;
  for (let k = 0; k <= 4; k++){ const y = Math.round(3 + k*(h-7)/4)+.5; g.beginPath(); g.moveTo(0, y); g.lineTo(w-32, y); g.stroke(); }
  for (let k = 0; k <= 6; k++){ const x = Math.round(2 + k*(w-34)/6)+.5; g.beginPath(); g.moveTo(x, 3); g.lineTo(x, h-4); g.stroke(); }
  g.fillStyle = '#7d8a94'; g.font = '10px "Roboto Mono", ui-monospace, monospace'; g.textAlign = 'right';
  g.textBaseline = 'top'; g.fillText(hi.toFixed(0), w-1, 1); g.textBaseline = 'bottom'; g.fillText(lo.toFixed(0), w-1, h-1);
  g.strokeStyle = '#f4d35e'; g.lineWidth = 1.5; g.lineJoin = 'round'; g.beginPath();
  L.forEach((r, i) => { const y = Y(fn(r)); i ? g.lineTo(X(i), y) : g.moveTo(X(i), y); }); g.stroke();
  set(out, fn(L[L.length-1]).toFixed(dp) + unit);
}

let dash = 0;
function renderAHU(){
  const [m, cls] = mode();
  $('a-mode').className = 'pill ' + cls; if (cache.mode !== m){ cache.mode = m; $('a-mode').lastElementChild.textContent = m; }
  set('a-cfm', Math.round(S.flowFrac*9600).toLocaleString()+' cfm');
  LABELS.forEach(L => L.rows.forEach((r, i) => { const v = r[1](); if (L.last[i] !== v){ L.last[i] = v; L.els[i].textContent = v; } }));
  setOA(S.oa); setEA(S.oa); setRA(1-S.oa);
  hwc.glow.setAttribute('opacity', (S.htg*.45).toFixed(2));
  chwc.glow.setAttribute('opacity', ((S.faults.chw ? 0 : S.clg)*.45).toFixed(2));
  filt.face.setAttribute('fill', S.fdp > .8 ? '#8a6a2a' : 'url(#gFilt)');
  FLOWS.forEach(f => { f.p.setAttribute('stroke', airColor(f.t())); f.p.setAttribute('opacity', (run() ? .25 + .65*clamp(f.k(), 0, 1) : 0).toFixed(2)); });
  POINTS.forEach((p, i) => set('pt'+i, p[3]()));
  set('i-oatv', deg(S.oat));
  set('th-avg', deg(S.zones.reduce((a, z) => a + z.T, 0)/S.zones.length) + ' avg');
}
const num = (id, fn) => $(id).addEventListener('input', e => { const v = parseFloat(e.target.value); if (isFinite(v)) fn(v); });
num('i-satsp', v => S.satSp = clamp(v, 50, 65));
num('i-dspsp', v => S.dspSp = clamp(v, .5, 2));
num('k-dsp-p', v => S.gains.dspP = clamp(v, 0, 3));
num('k-dsp-i', v => S.gains.dspI = clamp(v, 0, 5));
num('k-sat-p', v => S.gains.satP = clamp(v, 0, 1));
num('k-sat-i', v => S.gains.satI = clamp(v, 0, 1));
num('i-oat', v => S.oatMan = v);
$('i-occ').addEventListener('change', e => S.occMode = e.target.value);
$('i-oatauto').addEventListener('change', e => { S.oatAuto = e.target.checked; $('i-oat').disabled = S.oatAuto; if (!S.oatAuto){ S.oatMan = Math.round(S.oat); $('i-oat').value = S.oatMan; } });
['fan','chw','filter'].forEach(k => $('f-'+k).addEventListener('click', e => { S.faults[k] = !S.faults[k]; e.currentTarget.setAttribute('aria-pressed', S.faults[k]); }));

/* ---------- logic ---------- */
const bar = (id, v) => { $(id).style.width = Math.round(clamp(v,0,1)*100) + '%'; };
function renderLogic(){
  const tf = b => b ? 'TRUE' : 'FALSE';
  set('l-occm', S.occMode === 'auto' ? 'Auto' : 'Override'); set('l-w-occ', S.occ ? 'OCC' : S.setback ? 'SETBACK' : 'UNOCC'); set('l-nsb', S.setback ? 'Running' : 'Idle');
  set('l-pf', S.proven ? 'Proven' : S.fanCmd ? 'LOCKED OUT' : 'Off');
  set('l-sfc', S.fanCmd ? 'On' : 'Off'); set('l-w-sfc', S.fanCmd ? 'start' : 'stop');
  set('l-sfs', run() ? 'Running' : 'Stopped'); set('l-w-sfs', tf(run()));
  set('l-sfa', S.alarms.some(a => a.key==='sf' && a.active) ? 'ALARM' : 'Normal');
  set('l-dsp', S.dsp.toFixed(2)+' in'); set('l-w-dsp', S.dsp.toFixed(2)); set('l-dspsp', S.dspSp.toFixed(2)+' in');
  set('l-dspe', (S.dspErr >= 0 ? '+' : '')+S.dspErr.toFixed(2)); set('l-dspi', pc(S.sfI));
  set('l-w-sfo', pc(S.sfOut)); set('l-sfo', pc(S.sfOut)); set('l-sfa2', pc(S.speed)); bar('m-sf', S.speed);
  set('l-sat', deg(S.sat)); set('l-w-sat', f1(S.sat)); set('l-satsp', deg(S.satSp));
  set('l-sate', (S.satErr >= 0 ? '+' : '')+f1(S.satErr)+' °F'); set('l-sati', pc(S.satI)); set('l-w-u', pc(S.u));
  set('l-seq1', S.econ ? 'OA damper' : 'CHW valve'); set('l-seq2', S.econ ? 'CHW valve' : 'not used');
  set('l-stage', mode()[0]);
  set('l-hw', pc(S.htg)); bar('m-hw', S.htg); set('l-oa', pc(S.oa)); bar('m-oa', S.oa); set('l-chw', pc(S.clg)); bar('m-chw', S.clg);
  set('l-oat', deg(S.oat)); set('l-rat', deg(S.rat)); set('l-c1', tf(S.oat < 65)); set('l-c2', tf(S.oat < S.rat-2));
  set('l-w-econ', tf(S.econ)); set('l-econ', S.econ ? 'Enabled' : 'Disabled');
}

/* ---------- trends ---------- */
const CHARTS = [
  {id:'c-temp', title:'AHU-1 air temperatures', unit:' °F', dp:1, series:[['SA-T', r=>r.sat], ['MA-T', r=>r.mat], ['RA-T', r=>r.rat], ['OA-T', r=>r.oat]]},
  {id:'c-out', title:'AHU-1 outputs', unit:' %', dp:0, fixed:[0,100], series:[['SF-VFD', r=>r.sf], ['CHW-V', r=>r.clg], ['OA-D', r=>r.oa]]},
  {id:'c-zone', title:'Zone temperatures', unit:' °F', dp:1, series:S.zones.map((z, i) => [z.id+' '+z.name, r=>r.z[i]])},
];
$('charts').innerHTML = CHARTS.map(c => '<div class="panel chartp"><div class="chart-head"><h2>'+c.title+'</h2><div class="lg">' +
  c.series.map((s, i) => '<span><i style="background:var(--s'+(i+1)+')"></i>'+s[0]+' <b id="'+c.id+'-v'+i+'"></b></span>').join('') +
  '</div></div><canvas id="'+c.id+'" role="img" aria-label="'+c.title+', last 24 hours"></canvas></div>').join('');
const PADL = 40, PADR = 12;
CHARTS.forEach(c => {
  const cv = $(c.id);
  cv.addEventListener('pointermove', e => {
    const r = cv.getBoundingClientRect(), n = S.log.length;
    hover = clamp(Math.round((e.clientX - r.left - PADL)/(r.width - PADL - PADR)*(n-1)), 0, n-1); drawCharts();
  });
  cv.addEventListener('pointerleave', () => { hover = null; drawCharts(); });
});
function drawCharts(){
  const L = S.log; if (L.length < 2) return;
  const cs = getComputedStyle(document.documentElement), tok = n => cs.getPropertyValue(n).trim();
  const hi_ = hover == null ? L.length-1 : Math.min(hover, L.length-1);
  set('tr-at', (hover == null ? 'Showing now, ' : 'Showing ') + clock(L[hi_].t) + '.');
  for (const c of CHARTS){
    const cv = $(c.id), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (!w) continue;
    if (cv.width !== Math.round(w*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
    const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    const x0 = PADL, x1 = w-PADR, y0 = 10, y1 = h-22, n = L.length;
    const X = i => x0 + i/(n-1)*(x1-x0);
    let lo = Infinity, hi = -Infinity;
    if (c.fixed) [lo, hi] = c.fixed;
    else { for (const r of L) for (const s of c.series){ const v = s[1](r); if (v < lo) lo = v; if (v > hi) hi = v; }
      lo = Math.floor((lo-.5)/5)*5; hi = Math.ceil((hi+.5)/5)*5; }
    const Y = v => y1 - (v-lo)/(hi-lo)*(y1-y0);
    g.fillStyle = tok('--band');
    for (let i = 0; i < n-1; i++) if (!L[i].occ) g.fillRect(X(i), y0, X(i+1)-X(i)+.5, y1-y0);
    g.font = '11px "Roboto Mono", ui-monospace, monospace'; g.fillStyle = tok('--muted'); g.strokeStyle = tok('--line'); g.lineWidth = 1;
    const st = c.fixed ? 25 : (hi-lo) <= 20 ? 5 : (hi-lo) <= 50 ? 10 : 20;
    g.textAlign = 'right'; g.textBaseline = 'middle';
    for (let v = lo; v <= hi + 1e-6; v += st){ const y = Math.round(Y(v))+.5; g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke(); g.fillText(String(v), x0-6, y); }
    g.textAlign = 'center'; g.textBaseline = 'top';
    const every = w < 520 ? 360 : 180;
    for (let i = 0; i < n; i++){ const m = Math.round(L[i].t); if (m % every === 0 && X(i) > x0+14 && X(i) < x1-14) g.fillText(String(Math.floor(m/60)%24).padStart(2,'0')+':00', X(i), y1+6); }
    g.lineWidth = 2; g.lineJoin = 'round';
    c.series.forEach((s, k) => {
      g.strokeStyle = tok('--s'+(k+1)); g.beginPath();
      for (let i = 0; i < n; i++){ const y = Y(s[1](L[i])); i ? g.lineTo(X(i), y) : g.moveTo(X(i), y); }
      g.stroke();
      $(c.id+'-v'+k).textContent = s[1](L[hi_]).toFixed(c.dp) + c.unit;
    });
    if (hover != null){ g.strokeStyle = tok('--ink-2'); g.lineWidth = 1; const x = Math.round(X(hi_))+.5; g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke(); }
    c.series.forEach((s, k) => { g.fillStyle = tok('--s'+(k+1)); g.strokeStyle = tok('--canvas'); g.lineWidth = 2; g.beginPath(); g.arc(X(hi_), Y(s[1](L[hi_])), 4, 0, 7); g.fill(); g.stroke(); });
  }
}
function drawMinis(){ drawMini('mini-a', 'mn-a', r => r.mat, ' °F', 1); drawMini('mini-b', 'mn-b', r => r.clg, ' %', 0); }
window.addEventListener('resize', () => { const v = current(); if (v === 'trends') drawCharts(); if (v === 'ahu') drawMinis(); });

/* ---------- alarms ---------- */
let almSig = '';
$('alm').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const a = S.alarms.find(a => a.id === +b.dataset.id); if (a){ a.acked = true; render(true); } });
function renderAlarms(){
  const sig = S.alarms.map(a => a.id+':'+a.active+':'+a.acked).join('|');
  if (sig === almSig) return; almSig = sig;
  $('alm-empty').hidden = S.alarms.length > 0;
  $('alm').innerHTML = S.alarms.map(a => '<tr><td class="num" style="text-align:left;white-space:nowrap">'+clock(a.t)+'</td><td class="num" style="text-align:left">'+a.src+'</td><td>'+a.msg+'</td>' +
    '<td><span class="sev '+a.sev+'">'+(a.sev === 'crit' ? 'Critical' : 'Maintenance')+'</span></td>' +
    '<td>'+(a.active ? '<span class="sev '+a.sev+'">In alarm</span>' : '<span class="sev ok">Normal '+clock(a.rtn).slice(4)+'</span>')+'</td>' +
    '<td>'+(a.acked ? 'Acknowledged' : '<button type="button" class="ack" data-id="'+a.id+'">Acknowledge</button>')+'</td></tr>').join('');
}

/* ---------- frame loop ---------- */
function renderChrome(){
  set('h-time', clock(S.t)); set('h-oat', deg(S.oat));
  const o = $('h-occ'); o.className = 'pill' + (S.occ ? ' on' : ''); o.lastElementChild.textContent = S.occ ? 'Occupied' : 'Unoccupied';
  const act = S.alarms.filter(a => a.active).length, un = S.alarms.filter(a => !a.acked).length;
  const p = $('h-alm'); p.className = 'pill' + (act ? ' alm' : ' on'); p.lastElementChild.textContent = act ? act + ' in alarm' : 'No alarms';
  $('t-cnt').hidden = un === 0; $('t-cnt').textContent = un;
  // zone colors feed the plan, the thumbnail and the tree
  S.zones.forEach((z, i) => { const c = 'var('+zstate(z)[1]+')'; if (zel[i].c !== c){ zel[i].c = c; zel[i].b.style.backgroundColor = c; zel[i].th.style.backgroundColor = c; treeBtn['z'+i].firstChild.style.background = c; } });
  treeBtn.ahu.firstChild.style.background = S.faults.fan && S.fanCmd ? 'var(--crit)' : run() ? 'var(--good)' : 'var(--muted)';
  treeBtn.floor.firstChild.style.background = 'var(--accent)';
  const cur = tab !== 'graphics' ? '' : node === 'ahu' ? 'ahu' : zoneNode ? 'z'+sel : 'floor';
  for (const k in treeBtn) treeBtn[k].setAttribute('aria-current', k === cur);
}
let lastR = 0, lastC = 0;
function render(force){
  renderChrome();
  const v = current();
  if (v === 'floor') renderFloor();
  else if (v === 'ahu'){ renderAHU(); if (force) drawMinis(); }
  else if (v === 'logic') renderLogic();
  else if (v === 'alarms') renderAlarms();
  else if (v === 'trends' && force) drawCharts();
}
const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let prev = performance.now(), acc = 0, ang = 0;
function frame(now){
  const dt = Math.min(.25, (now - prev)/1000); prev = now;
  acc += dt * speed / DT;                       // sim minutes per second -> steps
  let k = Math.min(Math.floor(acc), 1200); acc -= Math.floor(acc);
  while (k-- > 0) step(S);
  const v = current();
  if (v === 'ahu' && !still){
    ang = (ang + S.speed*540*dt) % 360;
    $('sfan').setAttribute('transform', 'rotate('+ang.toFixed(1)+' 640 302)');
    $('rfan').setAttribute('transform', 'rotate('+(-ang).toFixed(1)+' 640 166)');
    dash = (dash - S.speed*60*dt) % 16; $('flows').setAttribute('stroke-dashoffset', dash.toFixed(1));
  }
  if (now - lastR > 200){ lastR = now; render(false); }
  if (now - lastC > 600){ lastC = now; if (v === 'trends') drawCharts(); else if (v === 'ahu') drawMinis(); }
  requestAnimationFrame(frame);
}
const h0 = (location.hash || '').slice(1);
if (h0 === 'ahu' || h0 === 'floor') go('graphics', h0); else if (['logic','trends','alarms'].includes(h0)) go(h0); else go('graphics', 'floor');
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(true));
requestAnimationFrame(frame);
})();
</script>
